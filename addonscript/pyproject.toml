[project]
name = "addonscript"
version = "5.0.0"
description = "Taskcluster addonscript worker"
url = "https://github.com/mozilla-releng/scriptworker-scripts"
authors = [
    { name = "Mozilla Release Engineering", email = "release+python@mozilla.com" }
]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

requires-python = ">=3.11"
dependencies = [
    "aiohttp",
    "async-timeout",
    "pyjwt",
    "scriptworker",
    "taskcluster",
]

[dependency-groups]
dev = [
    "aioresponses",
    "check-manifest",
    "coverage>=4.2",
    "freezegun",
    "mock",
    "pip-compile-multi",
    "pytest",
    # we use the event_loop fixture
    "pytest-asyncio<1.0",
    "pytest",
    "pytest-cov",
    "pytest-mock<1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["src/**"]

[tool.hatch.build.targets.wheel.sources]
"src/" = ""
